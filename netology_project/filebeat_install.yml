---
- name: Install and configure Filebeat on web servers
  hosts: webservers
  become: yes
  
  vars:
    # Динамическое получение IP-адресов из групп инвентори
    elastic_host: "{{ groups['elastic'][0] }}"
    kibana_host: "{{ groups['kibana'][0] }}"
    ssl_enabled: false
  
  tasks:
    # Шаг 1: Установка необходимых пакетов
    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
          - wget
        state: present
        update_cache: yes
    
    # Шаг 2: Скачать и установить GPG-ключ Elastic
    - name: Download and install Elastic GPG key
      shell: |
        wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
      args:
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg
    
    # Шаг 3: Добавление репозитория Elastic
    - name: Add Yandex Elastic repository
      copy:
        dest: /etc/apt/sources.list.d/yandex-elastic.list
        content: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/8 stable main"
        mode: '0644'
    
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    # Шаг 4: Установка Filebeat
    - name: Install Filebeat
      apt:
        name: filebeat
        state: present
    
    # Шаг 5: Создание директории для логов Filebeat
    - name: Create Filebeat log directory
      file:
        path: /var/log/filebeat
        state: directory
        owner: root
        group: root
        mode: '0755'
    
    # Шаг 6: Настройка Filebeat для сбора логов Nginx
    - name: Configure Filebeat for Nginx logs
      copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          # ======================== Filebeat configuration ==============================
          # Путь к модулям (ВАЖНО для работы модулей)
          filebeat.config.modules:
            path: ${path.config}/modules.d/*.yml
            reload.enabled: true
            reload.period: 10s
          
          # ============================== Filebeat inputs ===============================
          filebeat.inputs:
          
          # Nginx access logs
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/access.log
              - /var/log/nginx/*-access.log
            fields:
              type: nginx_access
              log_source: "{{ inventory_hostname }}"
            fields_under_root: true
            scan_frequency: 10s
            json.keys_under_root: true
            json.add_error_key: true
            tags: ["nginx", "access"]
          
          # Nginx error logs  
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/error.log
              - /var/log/nginx/*-error.log
            fields:
              type: nginx_error
              log_source: "{{ inventory_hostname }}"
            fields_under_root: true
            scan_frequency: 10s
            tags: ["nginx", "error"]
          
          # System logs (опционально)
          - type: log
            enabled: true
            paths:
              - /var/log/syslog
              - /var/log/auth.log
            fields:
              type: system
              log_source: "{{ inventory_hostname }}"
            fields_under_root: true
            scan_frequency: 30s
            tags: ["system"]
          
          # ============================== Processors ===============================
          processors:
            - add_host_metadata:
                when.not.contains.tags: forwarded
            - decode_json_fields:
                fields: ["message"]
                target: ""
                overwrite_keys: true
                when.has_fields: ['type']
          
          # ============================== Outputs ===============================
          # Output to Elasticsearch (безопасность отключена)
          output.elasticsearch:
            hosts: ["http://{{ elastic_host }}:9200"]
            indices:
              - index: "nginx-access-%{[agent.version]}-%{+yyyy.MM.dd}"
                when.equals:
                  type: "nginx_access"
              - index: "nginx-error-%{[agent.version]}-%{+yyyy.MM.dd}"
                when.equals:
                  type: "nginx_error"
              - index: "system-%{[agent.version]}-%{+yyyy.MM.dd}"
                when.equals:
                  type: "system"
          
          # ============================== Setup ===============================
          # Настройки для Kibana (без аутентификации)
          setup.kibana:
            host: "http://{{ kibana_host }}:5601"
          
          # Настройки мониторинга
          xpack.monitoring:
            enabled: true
            elasticsearch:
              hosts: ["http://{{ elastic_host }}:9200"]
          
          # ============================== Logging ===============================
          logging.level: info
          logging.to_files: true
          logging.files:
            path: /var/log/filebeat
            name: filebeat.log
            keepfiles: 7
            permissions: 0644
        mode: '0644'
        owner: root
        group: root
    
    # Шаг 7: Настройка модуля Nginx для Filebeat
    - name: Enable Nginx module for Filebeat
      shell: |
        filebeat modules enable nginx
      args:
        creates: /etc/filebeat/modules.d/nginx.yml
    
    - name: Configure Nginx module
      copy:
        dest: /etc/filebeat/modules.d/nginx.yml
        content: |
          - module: nginx
            access:
              enabled: true
              var.paths: ["/var/log/nginx/access.log*"]
            error:
              enabled: true
              var.paths: ["/var/log/nginx/error.log*"]
        mode: '0644'
        owner: root
        group: root
    
    # Шаг 8: Проверяем наличие логов Nginx
    - name: Check if Nginx logs exist
      stat:
        path: "{{ item }}"
      loop:
        - /var/log/nginx/access.log
        - /var/log/nginx/error.log
      register: nginx_logs
      ignore_errors: yes
    
    - name: Create Nginx log files if they don't exist
      file:
        path: "{{ item.item }}"
        state: touch
        owner: www-data
        group: www-data
        mode: '0644'
      loop: "{{ nginx_logs.results }}"
      when: not item.stat.exists
    
    # Шаг 9: Настройка шаблонов в Elasticsearch
    - name: Setup Filebeat templates in Elasticsearch
      shell: |
        filebeat setup --index-management -E output.elasticsearch.hosts=['http://{{ elastic_host }}:9200']
      args:
        creates: /usr/share/filebeat/.filebeat-setup-done
      ignore_errors: yes  # Игнорируем ошибки, если Elasticsearch не готов
    
    # Шаг 10: Запуск и включение Filebeat
    - name: Start and enable Filebeat service
      systemd:
        name: filebeat
        state: started
        enabled: yes
        daemon_reload: yes
    
    # Шаг 11: Проверка статуса Filebeat
    - name: Check Filebeat status
      shell: |
        systemctl is-active filebeat
      register: filebeat_status
      changed_when: false
    
    - name: Display Filebeat status
      debug:
        msg: "Filebeat service status: {{ filebeat_status.stdout }}"
    
    # Шаг 12: Проверка логов Filebeat
    - name: Check Filebeat logs for errors
      shell: |
        # Ждем немного перед проверкой
        sleep 3
        tail -20 /var/log/filebeat/filebeat.log | grep -E "(ERROR|WARN|Published|Harvester started)"
      register: filebeat_logs
      changed_when: false
      ignore_errors: yes
    
    - name: Display Filebeat log output
      debug:
        msg: |
          Filebeat logs:
          {{ filebeat_logs.stdout | default('No recent logs found') }}
    
    # Шаг 13: Проверка, что Filebeat отправляет данные в Elasticsearch
    - name: Test Filebeat connection to Elasticsearch
      shell: |
        # Проверяем, что можем подключиться к Elasticsearch
        curl -s -o /dev/null -w "%{http_code}" http://{{ elastic_host }}:9200/ || echo "Connection failed"
      register: es_connection_test
      changed_when: false
    
    - name: Display Elasticsearch connection status
      debug:
        msg: "Elasticsearch connection test: {{ es_connection_test.stdout }}"
