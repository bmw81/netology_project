---
- name: Import Grafana dashboard
  hosts: grafana
  become: yes
  vars:
    grafana_api_url: "http://localhost:3000"
    grafana_user: "admin"
    grafana_password: "admin"
    
  tasks:
    - name: Install curl and jq
      apt:
        name:
          - curl
          - jq
        state: present

    - name: Upload dashboard JSON file to remote host
      copy:
        src: monitoring-dashboard.json
        dest: /tmp/monitoring-dashboard.json
        mode: '0644'

    - name: Wait for Grafana API to be ready
      uri:
        url: "{{ grafana_api_url }}/api/health"
        method: GET
        status_code: 200
        timeout: 10
      register: grafana_health
      retries: 10
      delay: 5

    - name: Read dashboard JSON from remote file
      slurp:
        src: /tmp/monitoring-dashboard.json
      register: dashboard_json

    - name: Import dashboard via Grafana API
      uri:
        url: "{{ grafana_api_url }}/api/dashboards/db"
        method: POST
        user: "{{ grafana_user }}"
        password: "{{ grafana_password }}"
        force_basic_auth: yes
        body_format: json
        body: "{{ dashboard_json.content | b64decode | from_json }}"
        status_code: 200
      register: dashboard_import

    - name: Display import result
      debug:
        msg: "✅ Dashboard imported successfully! Status: {{ dashboard_import.status }}"

    - name: Cleanup temporary file
      file:
        path: /tmp/monitoring-dashboard.json
        state: absent

    - name: Display access information
      debug:
        msg: |
          🎉 Grafana dashboard setup complete!
          
          📍 Access URLs:
          - Grafana: http://{{ ansible_default_ipv4.address }}:3000
          - Prometheus: http://10.0.1.27:9090
          
          👤 Credentials:
          - Username: admin
          - Password: admin
          
          📊 Dashboard: System Monitoring Dashboard
          
          📈 Available metrics:
          - CPU: Utilization, Load Average, Saturation
          - RAM: Usage, Breakdown
          - Disk: Space, I/O
          - Network: Traffic, Errors
          - HTTP: Response count, size, status codes
          - System: Uptime, Process count
