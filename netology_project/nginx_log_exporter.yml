---
- name: Install and configure Nginx Log Exporter on web servers
  hosts: webservers
  become: yes
  vars:
    nginx_log_exporter_version: "1.9.2"
    nginx_log_exporter_port: 4040

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - wget
          - curl
        state: present
        update_cache: yes

    - name: Create user for nginx log exporter
      user:
        name: prometheus-nginxlog-exporter
        system: yes
        shell: /bin/false
        home: /nonexistent
        state: present

    - name: Create configuration directory
      file:
        path: /etc/prometheus-nginxlog-exporter
        state: directory
        owner: prometheus-nginxlog-exporter
        group: prometheus-nginxlog-exporter
        mode: '0755'

    - name: Download Nginx Log Exporter binary
      get_url:
        url: "https://github.com/martin-helmich/prometheus-nginxlog-exporter/releases/download/v{{ nginx_log_exporter_version }}/prometheus-nginxlog-exporter_{{ nginx_log_exporter_version }}_linux_amd64.tar.gz"
        dest: /tmp/prometheus-nginxlog-exporter.tar.gz
        mode: '0644'

    - name: Extract binary
      unarchive:
        src: /tmp/prometheus-nginxlog-exporter.tar.gz
        dest: /tmp/
        remote_src: yes
        creates: /tmp/prometheus-nginxlog-exporter/prometheus-nginxlog-exporter

    - name: Debug extracted files
      shell: |
        ls -la /tmp/
        ls -la /tmp/prometheus-nginxlog-exporter*/ 2>/dev/null || echo "No extracted directory found"
      register: debug_files
      changed_when: false

    - name: Show debug info
      debug:
        var: debug_files.stdout

    - name: Find extracted binary path
      find:
        paths: /tmp
        patterns: "prometheus-nginxlog-exporter"
        file_type: file
        recurse: yes
      register: found_binary

    - name: Show found binary
      debug:
        var: found_binary.files

    - name: Install binary using found path
      copy:
        src: "{{ found_binary.files[0].path if found_binary.files else '/tmp/prometheus-nginxlog-exporter/prometheus-nginxlog-exporter' }}"
        dest: /usr/sbin/prometheus-nginxlog-exporter
        owner: prometheus-nginxlog-exporter
        group: prometheus-nginxlog-exporter
        mode: '0755'
        remote_src: yes
      when: found_binary.files | length > 0

    - name: Add prometheus-nginxlog-exporter to adm group for log access
      user:
        name: prometheus-nginxlog-exporter
        groups: adm
        append: yes

    - name: Create Nginx Log Exporter configuration
      copy:
        content: |
          listen {
            port = {{ nginx_log_exporter_port }}
            address = "0.0.0.0"
          }

          namespace "nginx" {
            source {
              files = ["/var/log/nginx/access.log"]
            }
            
            format = "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\""
            
            labels {
              environment = "production"
            }
          }
        dest: /etc/prometheus-nginxlog-exporter.hcl
        owner: prometheus-nginxlog-exporter
        group: prometheus-nginxlog-exporter
        mode: '0644'

    - name: Create systemd service file
      copy:
        content: |
          [Unit]
          Description=NGINX metrics exporter for Prometheus
          Documentation=https://github.com/martin-helmich/prometheus-nginxlog-exporter
          After=network.target

          [Service]
          Type=simple
          User=prometheus-nginxlog-exporter
          Group=prometheus-nginxlog-exporter
          ExecStart=/usr/sbin/prometheus-nginxlog-exporter -config-file /etc/prometheus-nginxlog-exporter.hcl
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/prometheus-nginxlog-exporter.service
        mode: '0644'
      notify: reload systemd

    - name: Ensure nginx log directory exists with correct permissions
      file:
        path: /var/log/nginx
        state: directory
        mode: '0755'
        owner: root
        group: adm

    - name: Ensure nginx access log file exists
      file:
        path: /var/log/nginx/access.log
        state: touch
        owner: root
        group: adm
        mode: '0644'

    - name: Enable and start Nginx Log Exporter service
      systemd:
        name: prometheus-nginxlog-exporter
        state: started
        enabled: yes

    - name: Wait for Nginx Log Exporter to start
      wait_for:
        port: "{{ nginx_log_exporter_port }}"
        delay: 5
        state: started
        timeout: 30

    - name: Verify Nginx Log Exporter metrics endpoint
      uri:
        url: "http://localhost:{{ nginx_log_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: log_exporter_metrics
      failed_when: log_exporter_metrics.status != 200
      ignore_errors: yes

    - name: Cleanup temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/prometheus-nginxlog-exporter.tar.gz
        - /tmp/prometheus-nginxlog-exporter*
        - /tmp/prometheus-nginxlog-exporter-*

    - name: Display success message
      debug:
        msg: |
          ✅ Nginx Log Exporter status on {{ inventory_hostname }}:
          - Service: {{ 'Running' if log_exporter_metrics.status == 200 else 'Check manually' }}
          - Port: {{ nginx_log_exporter_port }}
          - Metrics: http://localhost:{{ nginx_log_exporter_port }}/metrics

- name: Update Prometheus configuration with nginx log exporters
  hosts: prometheus
  become: yes

  tasks:
    - name: Ensure file_sd directory exists on Prometheus
      file:
        path: /etc/prometheus/file_sd
        state: directory
        owner: prometheus
        group: prometheus
        mode: '0755'

    - name: Create dynamic targets configuration for nginx log exporters
      copy:
        content: |
          - targets:
            {% for host in groups['webservers'] -%}
            - "{{ host }}:4040"
            {% endfor -%}
            labels:
              job: nginx-log-exporter
              environment: production
        dest: /etc/prometheus/file_sd/nginx_log_exporter_targets.yml
        owner: prometheus
        group: prometheus
        mode: '0644'

    - name: Display created YAML content
      shell: cat /etc/prometheus/file_sd/nginx_log_exporter_targets.yml
      register: yaml_content
      changed_when: false

    - name: Show YAML content
      debug:
        var: yaml_content.stdout

    - name: Validate Prometheus configuration syntax
      shell: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
      register: prometheus_config_check
      failed_when: prometheus_config_check.rc != 0
      changed_when: false
      ignore_errors: yes

    - name: Display validation result
      debug:
        var: prometheus_config_check.stdout

    - name: Simple Prometheus health check
      shell: curl -s -o /dev/null -w "%{http_code}" http://localhost:9090/-/healthy
      register: prometheus_health
      changed_when: false

    - name: Display final success message
      debug:
        msg: |
          ✅ Nginx Log Exporter setup completed!
          
          Summary:
          - Nginx Log Exporter installed on all web servers
          - Prometheus configured to scrape nginx metrics
          
          URLs:
          - Prometheus UI: http://{{ inventory_hostname }}:9090
          - Check targets in Prometheus UI -> Status -> Targets
