---
- name: Install and configure Kibana
  hosts: kibana
  become: yes
  
  vars:
    # Динамическое получение IP-адресов
    kibana_host: "{{ ansible_default_ipv4.address }}"  # IP Kibana машины
    elastic_host: "{{ groups['elastic'][0] }}"          # Первый хост из группы elastic
    # Безопасность отключена в Elasticsearch, поэтому используем HTTP без аутентификации
    elastic_protocol: "http"
    
  tasks:
    # Шаг 1: Установка необходимых пакетов
    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
          - wget
        state: present
        update_cache: yes
    
    # Шаг 2: Скачать и установить GPG-ключ Elastic
    - name: Download and install Elastic GPG key
      shell: |
        wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
      args:
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg
    
    # Шаг 3: Добавление репозитория Elastic
    - name: Add Yandex Elastic repository
      copy:
        dest: /etc/apt/sources.list.d/yandex-elastic.list
        content: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/8 stable main"
        mode: '0644'
    
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    # Шаг 4: Установка Kibana
    - name: Install Kibana
      apt:
        name: kibana
        state: present
    
    # Шаг 5: Настройка Kibana
    - name: Configure Kibana
      copy:
        dest: /etc/kibana/kibana.yml
        content: |
          # =================== System: Kibana Server (Optional) ===================
          # Kibana is served by a back end server. This setting specifies the port to use.
          #server.port: 5601
          
          # Specifies the address to which the Kibana server will bind. IP addresses and host names are both valid values.
          # The default is 'localhost', which usually means remote machines will not be able to connect.
          # To allow connections from remote users, set this parameter to a non-loopback address.
          server.host: "{{ kibana_host }}"
          
          # Enables you to specify a path to mount Kibana at if you are running behind a proxy.
          # Use the `server.rewriteBasePath` setting to tell Kibana if it should remove the basePath
          # from requests it receives, and to prevent a deprecation warning at startup.
          # This setting cannot end in a slash.
          #server.basePath: ""
          
          # Specifies whether Kibana should rewrite requests that are prefixed with
          # `server.basePath` or require that they are rewritten by your reverse proxy.
          #server.rewriteBasePath: false
          
          # The maximum payload size in bytes for incoming server requests.
          #server.maxPayloadBytes: 1048576
          
          # The Kibana server's name.  This is used for display purposes.
          server.name: "kibana-{{ inventory_hostname }}"
          
          # =================== System: Kibana Server (Optional) ===================
          # The URLs of the Elasticsearch instances to use for all your queries.
          elasticsearch.hosts: ["{{ elastic_protocol }}://{{ elastic_host }}:9200"]
          
          # When this setting's value is true Kibana uses the hostname specified in the server.host
          # setting. When the value of this setting is false, Kibana uses the hostname of the host
          # that connects to this Kibana instance.
          #elasticsearch.preserveHost: true
          
          # Kibana uses an index in Elasticsearch to store saved searches, visualizations and
          # dashboards. Kibana creates a new index if the index doesn't already exist.
          kibana.index: ".kibana"
          
          # The default application to load.
          #kibana.defaultAppId: "home"
          
          # If your Elasticsearch is protected with basic authentication, these settings provide
          # the username and password that the Kibana server uses to perform maintenance on the Kibana
          # index at startup. Your Kibana users still need to authenticate with Elasticsearch, which
          # is proxied through the Kibana server.
          #elasticsearch.username: "elastic"
          #elasticsearch.password: "elasticpassword"
          
          # =================== System: Elasticsearch (Optional) ===================
          # Time in milliseconds to wait for Elasticsearch to respond to pings. Defaults to the value of
          # the elasticsearch.requestTimeout setting.
          #elasticsearch.pingTimeout: 1500
          
          # Time in milliseconds to wait for responses from the back end or Elasticsearch. This value
          # must be a positive integer.
          #elasticsearch.requestTimeout: 30000
          
          # List of Kibana client-side headers to send to Elasticsearch. To send *no* client-side
          # headers, set this value to [] (an empty list).
          #elasticsearch.requestHeadersWhitelist: [ authorization ]
          
          # Header names and values that are sent to Elasticsearch. Any custom headers cannot be overwritten
          # by client-side headers, regardless of the elasticsearch.requestHeadersWhitelist configuration.
          #elasticsearch.customHeaders: {}
          
          # Time in milliseconds for Elasticsearch to wait for responses from shards. Set to 0 to disable.
          #elasticsearch.shardTimeout: 30000
          
          # =================== System: Logging ===================
          # Enables you specify a file where Kibana stores log output.
          logging.dest: /var/log/kibana/kibana.log
          
          # Set the value of this setting to true to suppress all logging output.
          #logging.silent: false
          
          # Set the value of this setting to true to suppress all logging output other than error messages.
          #logging.quiet: false
          
          # Set the value of this setting to true to log all events, including system usage information
          # and all requests.
          #logging.verbose: false
          
          # =================== System: Other ===================
          # Specifies locale to be used for all localizable strings, dates and number formats.
          # Supported languages are the following: English - en , by default , Chinese - zh-CN .
          #i18n.locale: "en"
        mode: '0644'
        owner: kibana
        group: kibana
    
    # Шаг 6: Создание директории для логов Kibana
    - name: Create Kibana log directory
      file:
        path: /var/log/kibana
        state: directory
        owner: kibana
        group: kibana
        mode: '0755'
    
    # Шаг 7: Настройка systemd для Kibana (ИСПРАВЛЕННЫЙ)
    - name: Create systemd service directory for Kibana
      file:
        path: /etc/systemd/system/kibana.service.d
        state: directory
        mode: '0755'
      when: ansible_service_mgr == "systemd"
    
    - name: Configure systemd service for Kibana
      copy:
        dest: /etc/systemd/system/kibana.service.d/override.conf
        content: |
          [Service]
          # Увеличиваем время ожидания запуска
          TimeoutStartSec=300
          # Увеличиваем лимит памяти
          MemoryLimit=2G
        mode: '0644'
      when: ansible_service_mgr == "systemd"
    
    # Шаг 8: Обновление systemd и добавление Kibana в автозагрузку
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: ansible_service_mgr == "systemd"
    
    - name: Enable Kibana service
      systemd:
        name: kibana
        enabled: yes
    
    # Шаг 9: Запуск Kibana
    - name: Start Kibana service
      systemd:
        name: kibana
        state: started
    
    # Шаг 10: Ожидание запуска Kibana
    - name: Wait for Kibana to start
      pause:
        seconds: 30
    
    # Шаг 11: Проверка статуса Kibana
    - name: Check Kibana status
      shell: |
        systemctl is-active kibana
      register: kibana_status
      changed_when: false
    
    - name: Display Kibana status
      debug:
        msg: "Kibana service status: {{ kibana_status.stdout }}"
    
    # Шаг 12: Проверка доступности Kibana
    - name: Verify Kibana is accessible
      uri:
        url: "http://{{ kibana_host }}:5601/api/status"
        method: GET
        status_code: 200
        timeout: 30
      register: kibana_check
      until: kibana_check.status == 200
      retries: 10
      delay: 10
      ignore_errors: yes
    
    - name: Display Kibana access status
      debug:
        msg: "Kibana is accessible at: http://{{ kibana_host }}:5601"
      when: kibana_check.status == 200
    
    # Шаг 13: Проверка подключения Kibana к Elasticsearch
    - name: Check Kibana logs for Elasticsearch connection
      shell: |
        # Ждем немного и проверяем логи
        sleep 10
        tail -30 /var/log/kibana/kibana.log | grep -E "(elasticsearch|connected|ready|error|fail)" | tail -5
      register: kibana_logs
      changed_when: false
      ignore_errors: yes
    
    - name: Display Kibana logs
      debug:
        msg: |
          Kibana logs:
          {{ kibana_logs.stdout | default('No relevant logs found') }}
    
    # Шаг 14: Настройка индексов в Kibana (опционально)
    - name: Setup Kibana index patterns via API
      uri:
        url: "http://{{ kibana_host }}:5601/api/saved_objects/index-pattern/filebeat-*"
        method: POST
        headers:
          Content-Type: "application/json"
          kbn-xsrf: "true"
        body_format: json
        body:
          attributes:
            title: "filebeat-*"
            timeFieldName: "@timestamp"
      register: kibana_setup
      ignore_errors: yes
      when: kibana_check.status == 200
    
    - name: Display Kibana setup status
      debug:
        msg: "Kibana index pattern setup: {{ kibana_setup.status | default('Not attempted') }}"
