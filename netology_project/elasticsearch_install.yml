---
- name: Install and configure Elasticsearch
  hosts: elastic
  become: yes
  
  vars:
    elastic_version: "8.19.8"
    network_host: "10.0.1.11"  # Явно указываем IP из инвентори
  
  tasks:
    # Шаг 1: Установка необходимых пакетов
    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
          - wget
        state: present
        update_cache: yes
    
    # Шаг 2: Скачать и установить GPG-ключ Elastic
    - name: Download and install Elastic GPG key
      shell: |
        wget -qO - https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg
      args:
        creates: /usr/share/keyrings/elasticsearch-keyring.gpg
    
    # Шаг 3: Добавление репозитория и обновление кэша
    - name: Add Yandex Elastic repository
      copy:
        dest: /etc/apt/sources.list.d/yandex-elastic.list
        content: "deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/8 stable main"
        mode: '0644'
    
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    # Шаг 4: Установка Elasticsearch
    - name: Install Elasticsearch
      apt:
        name: elasticsearch
        state: present
    
    # Шаг 5: Установка Java
    - name: Install Java
      apt:
        name: openjdk-17-jdk
        state: present
    
    # Шаг 6: Увеличение лимитов виртуальной памяти для Elasticsearch
    - name: Increase vm.max_map_count
      sysctl:
        name: vm.max_map_count
        value: '262144'
        sysctl_set: yes
        state: present
        reload: yes
    
    # Шаг 7: Полностью перезаписываем конфигурационный файл Elasticsearch
    - name: Configure Elasticsearch
      copy:
        dest: /etc/elasticsearch/elasticsearch.yml
        content: |
          # ----------------------------------- Paths ------------------------------------
          path.data: /var/lib/elasticsearch
          path.logs: /var/log/elasticsearch
          
          # ---------------------------------- Network -----------------------------------
          network.host: "{{ network_host }}"
          http.port: 9200
          
          # --------------------------------- Discovery ----------------------------------
          discovery.type: single-node
          
          # --------------------------------- Security -----------------------------------
          # Отключаем безопасность для упрощения тестирования
          xpack.security.enabled: false
          xpack.security.enrollment.enabled: false
          xpack.security.http.ssl.enabled: false
          xpack.security.transport.ssl.enabled: false
          
          # ---------------------------------- CORS --------------------------------------
          http.cors.enabled: true
          http.cors.allow-origin: "*"
          http.cors.allow-headers: X-Requested-With,Content-Type,Content-Length,Authorization
          
          # --------------------------------- Cluster ------------------------------------
          cluster.name: "elk-cluster"
          node.name: "{{ inventory_hostname }}"
        mode: '0644'
        owner: elasticsearch
        group: elasticsearch
    
    # Шаг 8: Настраиваем память для Elasticsearch
    - name: Configure JVM options
      copy:
        dest: /etc/elasticsearch/jvm.options.d/heap-size.options
        content: |
          -Xms4g
          -Xmx4g
        mode: '0644'
        owner: elasticsearch
        group: elasticsearch
    
    # Шаг 9: Устанавливаем правильные права
    - name: Set proper permissions on Elasticsearch data and logs
      file:
        path: "{{ item }}"
        owner: elasticsearch
        group: elasticsearch
        recurse: yes
      loop:
        - /var/lib/elasticsearch
        - /var/log/elasticsearch
        - /etc/elasticsearch
    
    # Шаг 10: Запуск и настройка Elasticsearch
    - name: Start and enable Elasticsearch service
      systemd:
        name: elasticsearch
        state: started
        enabled: yes
        daemon_reload: yes
    
    - name: Wait for Elasticsearch to start
      pause:
        seconds: 45
    
    - name: Check if Elasticsearch is running
      shell: |
        systemctl is-active elasticsearch
      register: elastic_status
      changed_when: false
      failed_when: false
    
    - name: Display Elasticsearch status
      debug:
        msg: "Elasticsearch service status: {{ elastic_status.stdout }}"
    
    # Шаг 11: Проверка доступности Elasticsearch
    - name: Verify Elasticsearch is accessible
      uri:
        url: "http://{{ network_host }}:9200/"
        method: GET
        status_code: 200
        timeout: 30
      register: elastic_check
      until: elastic_check.status == 200
      retries: 10
      delay: 5
      ignore_errors: yes
    
    - name: Display Elasticsearch cluster info
      debug:
        msg: "Elasticsearch is running at http://{{ network_host }}:9200/"
    
    # Шаг 12: Проверяем работу Elasticsearch
    - name: Check Elasticsearch health
      shell: |
        curl -s "http://{{ network_host }}:9200/_cluster/health?pretty"
      register: es_health
      changed_when: false
    
    - name: Display Elasticsearch health
      debug:
        msg: "{{ es_health.stdout }}"
